<!DOCTYPE html>
<!-- Исходник картинки приветствия docs/welcome.png (ровно 640×360 — требование Telegram).
     Показывается в пустом чате над «Что умеет этот бот?». Установить: @BotFather → Welcome message → Set Welcome Picture -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 640px; height: 360px; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
    background: radial-gradient(circle at 90% 10%, #1d5a8c 0%, #0f2638 60%, #0a1824 100%);
    padding: 34px 38px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .tag {
    display: inline-block;
    align-self: flex-start; font-size: 15px; font-weight: 600; color: #8fd3ff;
    background: rgba(42,171,238,.15); border: 1px solid rgba(42,171,238,.45);
    padding: 4px 12px; border-radius: 999px;
  }
  h1 { font-size: 38px; line-height: 1.12; font-weight: 700; margin-top: 16px; }
  h1 span { color: #2AABEE; }
  .steps { display: flex; gap: 10px; }
  .step {
    flex: 1; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 13px 12px; font-size: 16px; line-height: 1.3;
  }
  .step .icon { font-size: 24px; display: block; margin-bottom: 6px; }
  .step b { display: block; font-size: 17px; }
  .step small { color: #b9cad8; font-size: 14px; }
</style>
</head>
<body>
  <div>
    <div class="tag">🧪 Демо для юридических фирм</div>
    <h1>Сбор документов<br>на <span>банкротство</span> физлиц</h1>
  </div>
  <div class="steps">
    <div class="step"><span class="icon">📎</span><b>Клиент</b><small>присылает документы по чек-листу</small></div>
    <div class="step"><span class="icon">🔔</span><b>Бот</b><small>следит за комплектностью и напоминает</small></div>
    <div class="step"><span class="icon">✅</span><b>Юрист</b><small>проверяет каждый документ в&nbsp;один&nbsp;клик</small></div>
  </div>
</body>
</html>
