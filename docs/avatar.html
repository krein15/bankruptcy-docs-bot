<!DOCTYPE html>
<!-- Исходник аватарки бота docs/avatar.png (640×640). Telegram обрезает её кругом —
     всё важное держим в центре. Установить: @BotFather → /setuserpic -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 640px; height: 640px; overflow: hidden; }
</style>
</head>
<body>
<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37BBFE"/>
      <stop offset="1" stop-color="#1E7FC4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B3A5E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- лист документа с загнутым уголком -->
  <g filter="url(#shadow)">
    <path d="M190 120 H400 L470 190 V500 a20 20 0 0 1 -20 20 H190 a20 20 0 0 1 -20 -20 V140 a20 20 0 0 1 20 -20 Z" fill="#FFFFFF"/>
    <path d="M400 120 V170 a20 20 0 0 0 20 20 H470 Z" fill="#D5E9F7"/>
  </g>

  <!-- пункты чек-листа: два выполнено, один нет -->
  <g>
    <circle cx="232" cy="248" r="26" fill="#34C759"/>
    <path d="M219 248 l9 9 l18 -19" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="278" y="236" width="150" height="24" rx="12" fill="#CFE3F3"/>

    <circle cx="232" cy="328" r="26" fill="#34C759"/>
    <path d="M219 328 l9 9 l18 -19" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="278" y="316" width="120" height="24" rx="12" fill="#CFE3F3"/>

    <circle cx="232" cy="408" r="23" fill="none" stroke="#B9D3E8" stroke-width="7"/>
    <rect x="278" y="396" width="140" height="24" rx="12" fill="#CFE3F3"/>
  </g>
</svg>
</body>
</html>
